name: Deploy

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, openssl, json, dom, curl
          tools: composer

      - name: Install Dependencies
        run: composer install

      - name: Run PHPCBF (auto-fix)
        run: vendor/bin/phpcbf || true

      - name: Run PHPCS
        run: vendor/bin/phpcs

  build:
    name: Build
    needs: lint
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, openssl, json, dom, curl
          tools: composer

      - name: Verify version consistency
        run: |
          PLUGIN_VERSION=$(grep -oP "define\(\s*['\"]DCIB_VERSION['\"]\s*,\s*['\"]\K[0-9]+\.[0-9]+(\.[0-9]+)?" ra-dynamic-contact-info-blocks.php || true)
          HEADER_VERSION=$(grep -oP "^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+(\.[0-9]+)?" ra-dynamic-contact-info-blocks.php || true)
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"

          if [ -z "${PLUGIN_VERSION}" ]; then
            echo "::error::Could not read DCIB_VERSION from ra-dynamic-contact-info-blocks.php"
            exit 1
          fi

          if [ "${TAG_VERSION}" != "${PLUGIN_VERSION}" ]; then
            echo "::error::Version mismatch! Tag: ${TAG_VERSION}, Plugin: ${PLUGIN_VERSION}"
            exit 1
          fi

          if [ -n "${HEADER_VERSION}" ] && [ "${HEADER_VERSION}" != "${PLUGIN_VERSION}" ]; then
            echo "::error::Version mismatch! Plugin header: ${HEADER_VERSION}, DCIB_VERSION: ${PLUGIN_VERSION}"
            exit 1
          fi

          echo "Version check passed: ${PLUGIN_VERSION}"

      - name: Create Archive
        run: |
          mkdir -p "dist/ra-dynamic-contact-info-blocks"
          rsync -a \
            --exclude=.git/ \
            --exclude=.github/ \
            --exclude=.gitignore \
            --exclude=.editorconfig \
            --exclude=phpcs.xml \
            --exclude=composer.json \
            --exclude=composer.lock \
            --exclude=composer.phar \
            --exclude='*.md' \
            --exclude='*.json' \
            --exclude=.agents/ \
            --exclude=vendor/ \
            --exclude=node_modules/ \
            --exclude=dist/ \
            --exclude=build.js \
            ./ "dist/ra-dynamic-contact-info-blocks/"
          ( cd dist && zip -r -X ../ra-dynamic-contact-info-blocks.zip ra-dynamic-contact-info-blocks )

      - name: Verify Archive Layout
        run: |
          # WordPress uses the single top-level directory as the installed plugin
          # folder. A flat archive makes WP fall back to the basename of its unpack
          # working directory (WP_Upgrader::get_working_dir_name()), which appends
          # a random 16 character suffix, e.g. ra-dynamic-contact-info-blocks-U6zY9I0dwhTR7UWr.
          TOP_LEVEL=$(unzip -Z1 ra-dynamic-contact-info-blocks.zip | cut -d/ -f1 | sort -u)

          if [ "${TOP_LEVEL}" != "ra-dynamic-contact-info-blocks" ]; then
            echo "::error::Archive must contain exactly one top-level directory named ra-dynamic-contact-info-blocks (found: ${TOP_LEVEL})"
            exit 1
          fi

          if ! unzip -Z1 ra-dynamic-contact-info-blocks.zip | grep -qx 'ra-dynamic-contact-info-blocks/ra-dynamic-contact-info-blocks.php'; then
            echo "::error::Archive is missing ra-dynamic-contact-info-blocks/ra-dynamic-contact-info-blocks.php"
            exit 1
          fi

          echo "Archive layout verified"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ra-dynamic-contact-info-blocks-zip
          path: ra-dynamic-contact-info-blocks.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: ra-dynamic-contact-info-blocks-zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ra-dynamic-contact-info-blocks.zip
